name: Release on Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 只匹配语义化版本标签，如 v0.9.6
  workflow_dispatch:


jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Windows
        run: npm run build:win
        env:
        # 如果你的构建脚本需要环境变量，请在这里设置
        # GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version from tag
        id: get_version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compress win-unpacked directory
        run: |
          Compress-Archive -Path "dist/win-unpacked" -DestinationPath "dist/stray-vivify-win-unpacked-${{ steps.get_version.outputs.version }}.zip"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.tag }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          files: |
            dist/stray-vivify-${{ steps.get_version.outputs.version }}-setup.exe
            dist/stray-vivify-win-unpacked-${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
