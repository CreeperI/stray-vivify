appId: com.stray-vivify.terminalflow
productName: stray-vivify
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!charts/**'
  - '!skin/**'
  - "!**/.idea/*"
  - "!**/node_modules/*"
  - "!external/"
  - "!**/.lingma/*"
asarUnpack:
  - resources/**
  - src/renderer/public/**
win:
  executableName: stray-vivify
  # 只出免安装 zip（Release 里就这一个产物，程序内的自动更新也拉它）。
  # artifactName 必须保持 <product>-<version>-win-unpacked.zip 的格式：
  # src/main/update.ts 靠 "-win-unpacked.zip" 后缀在 Release 里找更新包。
  # 想恢复 NSIS 安装包：target: [zip, nsis]
  target: zip
  artifactName: ${productName}-${version}-win-unpacked.${ext}
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
